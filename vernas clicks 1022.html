<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播购物模拟</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    height: 100%;
}
body {
    background: #f5f5f5;
    font-family: 微软雅黑, system-ui, sans-serif;
    overflow: hidden;
}
/* 视频初始播放区域 */
.stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    transition: all 0.4s ease;
    z-index: 20;
}
.video-main {
    height: 90vh;
    max-width: 90vw;
    aspect-ratio: auto;
    object-fit: contain;
    background: transparent;
    display: block;
    border-radius: 10px;
    transition: all 0.4s ease;
}
/* 视频缩小后的浮窗状态 */
.stage.minimized {
    background: transparent;
    pointer-events: none;
}
.stage.minimized .video-main {
    pointer-events: auto;
    width: var(--float-width, min(22vw, 160px));
    height: var(--float-height, auto);
    max-width: calc(100vw - 24px);
    max-height: 25dvh;
    object-fit: contain;
    background: transparent;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    position: fixed;
    left: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 50;
}
/* 商品详情页面 */
.detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #fff;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(100%);
    transition: all 0.4s ease;
    pointer-events: none;
    z-index: 10;
}
.detail-panel.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
}
.detail-header {
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.detail-header h3 {
    font-size: 16px;
    color: #333;
}
.detail-iframe {
    flex: 1;
    width: 100%;
    border: 0;
}
/* 购买成功弹窗 */
.success-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 10002;
    display: none;
}
.success-mask.show {
    display: flex;
    align-items: center;
    justify-content: center;
}
.success-box {
    width: 85%;
    max-width: 360px;
    background: #fff;
    border-radius: 14px;
    padding: 30px 25px;
    text-align: center;
}
.success-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #07c160;
    color: #fff;
    font-size: 32px;
    line-height: 60px;
    margin: 0 auto 15px;
}
.success-text {
    font-size: 20px;
    font-weight: bold;
    color: #333;
    margin-bottom: 20px;
}
.success-desc {
    color: #666;
    margin-bottom: 25px;
}
.success-btn {
    width: 100%;
    padding: 12px;
    background: #ff6700;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
/* 手机端适配 */
@media (max-width: 767px) {
    .stage.minimized .video-main {
        width: var(--float-width, min(30vw, 130px));
        max-height: 25dvh;
        left: 10px;
        bottom: calc(
            10px + env(safe-area-inset-bottom, 0px)
        );
    }
}
</style>
</head>
<body>
<!-- 视频播放区域 -->
<div class="stage" id="stage">
    <video
        id="v"
        class="video-main"
        controls
        preload="auto"
        playsinline
        webkit-playsinline
        x5-video-player-type="h5"
        x5-video-player-fullscreen="false"
        controlslist="nofullscreen"
    >
        <source
            src="https://live-video-exp.oss-cn-hangzhou.aliyuncs.com/vernas_fuzzy.mp4"
        >
        您的浏览器不支持视频播放，请更换浏览器重试
    </video>
</div>
<!-- 商品详情页面 -->
<div class="detail-panel" id="detailPanel">
    <div class="detail-header">
        <h3>维娜氏焕颜精粹露 · 商品详情</h3>
    </div>
    <iframe
        class="detail-iframe"
        src="https://Matcha998.github.io/live-demo/vernas detail 2759 1021.html"
    ></iframe>
</div>
<!-- 购买成功提示 -->
<div class="success-mask" id="successMask">
    <div class="success-box">
        <div class="success-icon">✓</div>
        <div class="success-text">下单成功！</div>
        <div class="success-desc">查看订单详情</div>
        <button
            class="success-btn"
            id="closeSuccessBtn"
        >
            继续逛逛
        </button>
    </div>
</div>
<script>
const video = document.getElementById('v');
const stage = document.getElementById('stage');
const detailPanel = document.getElementById('detailPanel');
const successMask = document.getElementById('successMask');
const closeSuccessBtn = document.getElementById('closeSuccessBtn');
let naturalWidth = 0;
let naturalHeight = 0;
let minimized = false;
let hasBought = false;
let playTime = null;
let hasReported = false;
/* 获取视频原始宽高比例 */
video.addEventListener('loadedmetadata', function () {
    naturalWidth = video.videoWidth;
    naturalHeight = video.videoHeight;
    if (naturalWidth && naturalHeight) {
        video.style.aspectRatio =
            naturalWidth + ' / ' + naturalHeight;
        updateFloatingSize();
    }
});
/* 根据原始比例自动计算浮窗尺寸 */
function updateFloatingSize() {
    if (!naturalWidth || !naturalHeight) return;
    const ratio = naturalWidth / naturalHeight;
    const isMobile = window.innerWidth < 768;
    const preferredWidth = isMobile
        ? Math.min(window.innerWidth * 0.30, 130)
        : Math.min(
            Math.max(window.innerWidth * 0.22, 90),
            160
        );
    const maxWidth = Math.max(
        1,
        window.innerWidth - 24
    );
    const maxHeight = Math.max(
        1,
        window.innerHeight * (isMobile ? 0.25 : 0.25)
    );
    const width = Math.min(
        preferredWidth,
        maxWidth,
        maxHeight * ratio
    );
    stage.style.setProperty(
        '--float-width',
        width + 'px'
    );
    stage.style.setProperty(
        '--float-height',
        (width / ratio) + 'px'
    );
}
/* 窗口大小变化时重新适配 */
window.addEventListener(
    'resize',
    updateFloatingSize
);
/* 实验行为数据记录 */
function sendLog() {
    if (hasReported) return;
    hasReported = true;
    const didView = playTime !== null ? 1 : 0;
    const viewSec = (playTime !== null && hasBought)
        ? Math.round((Date.now() - playTime) / 1000)
        : 0;
    try {
        window.parent.postMessage({
            trigger: "detail_view_log",
            didViewDetail: didView,
            viewDetailSec: viewSec
        }, "*");
    } catch(e) {}
    console.log("[detail-view]", {
        didViewDetail: didView,
        viewDetailSec: viewSec
    });
}
/* 页面退出和隐藏时记录 */
window.addEventListener(
    'beforeunload',
    sendLog
);
document.addEventListener(
    'visibilitychange',
    () => {
        if (document.visibilityState === 'hidden') {
            sendLog();
        }
    }
);
/* 视频开始播放后缩小并显示商品详情 */
video.addEventListener('play', function () {
    if (minimized) return;
    minimized = true;
    updateFloatingSize();
    playTime = Date.now();
    stage.classList.add('minimized');
    detailPanel.classList.add('show');
});
/* 接收商品详情中的购买点击 */
window.addEventListener('message', function(e) {
    if (
        e.data &&
        e.data.trigger === "inner_buy_click"
    ) {
        // 已处理过：直接忽略重复消息，避免重复上报 / 重复触发
        if (hasBought) return;
        hasBought = true;
        try {
            window.parent.postMessage({
                trigger: "click_buy_btn"
            }, "*");
        } catch(err) {}
        sendLog();
        // 成功弹窗由详情页(iframe)内部统一弹出，外层不再重复显示，全程只出现一个
    }
});
/* 关闭购买成功弹窗 */
closeSuccessBtn.addEventListener('click', () => {
    successMask.classList.remove('show');
});
successMask.addEventListener('click', (e) => {
    if (e.target === successMask) {
        successMask.classList.remove('show');
    }
});
</script>
</body>
</html>
