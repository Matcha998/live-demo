<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播购物模拟</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {
    background:#f5f5f5;
    font-family:微软雅黑;
    padding-bottom:20px;
}
.live-wrap {
    width:100%;
    margin:0;
    background:#fff;
    overflow:hidden;
}
video {width:100%;display:block;}
.product-item {
    padding:16px;
    background:#fff;
}
.product-inner {
    display:flex;
    gap:14px;
    align-items:center;
    margin-bottom:14px;
}
.product-img {
    width:90px;
    height:90px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
}
.product-text {flex:1;}
.product-text h4 {
    font-size:16px;
    margin-bottom:6px;
    line-height:1.4;
}
.product-text .price {
    color:#ff4400;
    font-weight:bold;
    font-size:18px;
}
.product-btn-row {
    display:flex;
    gap:10px;
}
.product-btn {
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}
.product-btn-detail {
    background:#f0f0f0;
    color:#333;
}
.product-btn-buy {
    background:#ff6700;
    color:#fff;
}
.success-mask{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 10002;
    display: none;
}
.success-mask.show{
    display: flex;
    align-items: center;
    justify-content: center;
}
.success-box{
    width: 85%;
    max-width: 360px;
    background: #fff;
    border-radius: 14px;
    padding: 30px 25px;
    text-align: center;
}
.success-icon{
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #07c160;
    color: #fff;
    font-size:32px;
    line-height:60px;
    margin: 0 auto 15px;
}
.success-text{
    font-size: 20px;
    font-weight: bold;
    color: #333;
    margin-bottom: 20px;
}
.success-desc{
    color: #666;
    margin-bottom: 25px;
}
.success-btn{
    width: 100%;
    padding: 12px;
    background: #ff6700;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="live-wrap">
  <video id="v" controls preload="auto"
playsinline webkit-playsinline
x5-video-player-type="h5"
x5-video-player-fullscreen="false"
controlslist="nofullscreen">
    <source src="https://live-video-exp.oss-cn-hangzhou.aliyuncs.com/vernas_fuzzy.mp4">
    您的浏览器不支持视频播放，请更换浏览器重试
</video>
</div>
<div class="product-item">
  <div class="product-inner">
    <img class="product-img" src="https://matcha998.github.io/live-demo/vernas1.jpg">
    <div class="product-text">
      <h4>维娜氏焕颜精粹露紧致抗皱滋养湿敷补水保湿修护</h4>
      <div class="price">¥199</div>
    </div>
  </div>
  <div class="product-btn-row">
    <button class="product-btn product-btn-detail" id="detailBtn">查看详情</button>
    <button class="product-btn product-btn-buy" id="buyBtn">立即下单</button>
  </div>
</div>
<div class="success-mask" id="successMask">
  <div class="success-box">
    <div class="success-icon">✓</div>
    <div class="success-text">下单成功！</div>
    <div class="success-desc">查看订单详情</div>
    <button class="success-btn" id="closeSuccessBtn">继续逛逛</button>
  </div>
</div>
<script>
document.addEventListener('fullscreenchange', function(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
});
document.addEventListener('webkitfullscreenchange', function(){
    if(document.webkitFullscreenElement){ document.webkitExitFullscreen(); }
});
const video = document.getElementById('v');
const detailBtn = document.getElementById('detailBtn');
const buyBtn = document.getElementById('buyBtn');
const successMask = document.getElementById('successMask');
const closeSuccessBtn = document.getElementById('closeSuccessBtn');

let hasBought = false;
let hasReported = false;
let playTime = null;

function sendLog() {
    if (hasReported) return;
    hasReported = true;
    const didView = playTime !== null ? 1 : 0;
    const viewSec = (playTime !== null && hasBought)
        ? Math.round((Date.now() - playTime) / 1000)
        : 0;
    try {
        window.parent.postMessage({
            trigger: "detail_view_log",
            didViewDetail: didView,
            viewDetailSec: viewSec
        }, "*");
    } catch(e) {}
    console.log("[detail-view]", {didViewDetail: didView, viewDetailSec: viewSec});
}

window.addEventListener('beforeunload', sendLog);
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') sendLog();
});

video.addEventListener('play', function(){
    if(playTime === null){
        playTime = Date.now();
    }
});

detailBtn.addEventListener('click', ()=>{});

buyBtn.addEventListener('click', ()=>{
    if(!hasBought){
        hasBought = true;
        try {
            window.parent.postMessage({trigger:"click_buy_btn"}, "*");
        } catch(err) {}
        sendLog();
    }
    successMask.classList.add('show');
});
closeSuccessBtn.addEventListener('click', ()=>{
    successMask.classList.remove('show');
});
successMask.addEventListener('click', (e)=>{
    if(e.target === successMask){ successMask.classList.remove('show'); }
});
</script>
</body>
</html>
