<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播购物模拟</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
html,body {height:100%;}
body {
    background:#f5f5f5;
    font-family:微软雅黑;
    overflow:hidden;
}
/* ===== 初始状态：视频居中大图 ===== */
.stage {
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    transition:all .4s ease;
}
.video-main {
    width:100%;
    max-width:900px;
    aspect-ratio:16/9;
    background:#000;
    display:block;
}
.video-main.fit {
    width:auto;
    height:100%;
    max-width:100%;
}
/* ===== 播放后：视频缩到左下角小窗 ===== */
.stage.minimized {
    background:transparent;
    align-items:flex-end;
    justify-content:flex-start;
    padding:0;
    pointer-events:none;
}
.stage.minimized .video-main {
    pointer-events:auto;
    width:220px;
    max-width:40vw;
    height:390px;
    aspect-ratio:auto;
    object-fit:contain;
    background:#000;
    border-radius:10px;
    box-shadow:0 4px 20px #0006;
    position:fixed;
    left:16px;
    bottom:16px;
    z-index:50;
}
/* ===== 右侧精粹露详情大区域 ===== */
.detail-panel {
    position:fixed;
    top:0;
    right:0;
    width:calc(100% - 260px);
    height:100vh;
    background:#fff;
    display:flex;
    flex-direction:column;
    opacity:0;
    transform:translateX(30px);
    transition:all .4s ease;
    pointer-events:none;
    z-index:10;
}
.detail-panel.show {
    opacity:1;
    transform:translateX(0);
    pointer-events:auto;
}
.detail-header {
    padding:14px 20px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
}
.detail-header h3 {
    font-size:16px;
    color:#333;
}
.detail-iframe {
    flex:1;
    width:100%;
    border:0;
}
/* ===== 下单成功弹窗 ===== */
.success-mask{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 10002;
    display: none;
}
.success-mask.show{
    display: flex;
    align-items: center;
    justify-content: center;
}
.success-box{
    width: 85%;
    max-width: 360px;
    background: #fff;
    border-radius: 14px;
    padding: 30px 25px;
    text-align: center;
}
.success-icon{
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #07c160;
    color: #fff;
    font-size:32px;
    line-height:60px;
    margin: 0 auto 15px;
}
.success-text{
    font-size: 20px;
    font-weight: bold;
    color: #333;
    margin-bottom: 20px;
}
.success-desc{
    color: #666;
    margin-bottom: 25px;
}
.success-btn{
    width: 100%;
    padding: 12px;
    background: #ff6700;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
/* 移动端适配 */
@media (max-width: 768px) {
    .detail-panel {
        width:100%;
        height:55vh;
        top:auto;
        bottom:0;
        border-radius:16px 16px 0 0;
    }
    .stage.minimized .video-main {
        width:160px;
        max-width:45vw;
        height:284px;
        left:10px;
        bottom:calc(55vh + 10px);
    }
}
</style>
</head>
<body>
<!-- 视频舞台：初始大图，播放后缩左下 -->
<div class="stage" id="stage">
  <video id="v" class="video-main" controls preload="auto"
playsinline webkit-playsinline
x5-video-player-type="h5"
x5-video-player-fullscreen="false"
controlslist="nofullscreen">
    <source src="https://live-video-exp.oss-cn-hangzhou.aliyuncs.com/taiking_fuzzy.mp4">
    您的浏览器不支持视频播放，请更换浏览器重试
</video>
</div>
<!-- 右侧精粹露详情大面板 -->
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <h3>维娜氏焕颜精粹露 · 商品详情</h3>
  </div>
  <iframe class="detail-iframe" src="https://Matcha998.github.io/live-demo/vernas detail 2759 1021.html"></iframe>
</div>
<!-- 下单成功弹窗 -->
<div class="success-mask" id="successMask">
  <div class="success-box">
    <div class="success-icon">✓</div>
    <div class="success-text">下单成功！</div>
    <div class="success-desc">查看订单详情</div>
    <button class="success-btn" id="closeSuccessBtn">继续逛逛</button>
  </div>
</div>
<script>
// 禁止视频全屏
document.addEventListener('fullscreenchange', function(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
});
document.addEventListener('webkitfullscreenchange', function(){
    if(document.webkitFullscreenElement){ document.webkitExitFullscreen(); }
});
const video = document.getElementById('v');
const stage = document.getElementById('stage');
const detailPanel = document.getElementById('detailPanel');
const successMask = document.getElementById('successMask');
const closeSuccessBtn = document.getElementById('closeSuccessBtn');
let minimized = false;
let hasBought = false;   // 是否已记录过下单

/* ===== 浏览时间埋点：只上报「是否看了详情」+「看了多久」 ===== */
const enterTime = Date.now();
let playTime = null;
let hasReported = false;
function reportTime() {
    if (hasReported) return;
    hasReported = true;
    const didView = playTime !== null;
    const viewSec = didView ? Math.round((Date.now() - playTime) / 1000) : 0;
    const data = {
        trigger: "detail_view_log",
        didViewDetail: didView ? 1 : 0,
        viewDetailSec: viewSec
    };
    try {
        window.parent.postMessage(data, "*");
    } catch(e) {}
    console.log("[detail-view]", data);
}
window.addEventListener('beforeunload', reportTime);
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') reportTime();
});

// 点击播放后：视频缩到左下角，右侧详情滑出
video.addEventListener('play', function(){
    if(minimized) return;
    minimized = true;
    playTime = Date.now();
    stage.classList.add('minimized');
    detailPanel.classList.add('show');
});

// 接收详情iframe内"立即下单"按钮的消息，转发给Credamo
window.addEventListener('message', function(e){
    if(e.data && e.data.trigger === "inner_buy_click"){
        if(!hasBought){
            hasBought = true;
            try {
                window.parent.postMessage({trigger:"click_buy_btn"}, "*");
            } catch(err) {}
            console.log("[buy] 详情页立即下单被点击");
        }
        successMask.classList.add('show');
    }
});

closeSuccessBtn.addEventListener('click', ()=>{
    successMask.classList.remove('show');
});
successMask.addEventListener('click', (e)=>{
    if(e.target === successMask){ successMask.classList.remove('show'); }
});
</script>
</body>
</html>
